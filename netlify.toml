[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/whatsapp"
  to = "/.netlify/functions/whatsapp"
  status = 200
  force = true

[[redirects]]
  from = "/api/integrations"
  to = "/.netlify/functions/integrations"
  status = 200
  force = true

[[redirects]]
  from = "/api/approvals"
  to = "/.netlify/functions/approvals"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
